name: qwen2.5-vl-3B-hugsim-teacher-sft
description: >
  AutoVLA_PDMS_89 fine-tuned on the HUGSIM Claude-teacher rollouts (final-rewind, executed 5 s
  targets, 36.5k decisions over 200 scenarios of the by-scene dev half). Reasoning is per
  difficulty: medium/hard/extreme carry the teacher's reason into <think>, easy trains the
  direct-decision form. Built by student-driver
  simulators/hugsim_garage/agents/autovla_client/make_teacher_sft_data.py.

model:
  use_cot: true
  pretrained_model_path: /opt/dlami/nvme/rod/ckpts/autovla/Qwen2.5-VL-3B-Instruct
  # Continue from the released checkpoint rather than base Qwen: this is a fine-tune of AutoVLA,
  # not a retrain. run_sft.py fails loudly if the tensors do not match.
  init_from_checkpoint: /mnt/efs/users/rod/ckpts/AutoVLA/AutoVLA_PDMS_89.ckpt
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    # 100352 == 28*28*128, which is what dataset_utils/sft_dataset.py actually used while these
    # arms trained: it hardcoded the value and ignored this key. Pinned explicitly now that the
    # code reads it, so every published arm stays reproducible. The EVAL driver uses 109760, so
    # this is a real train/test mismatch -- see docs/FINETUNING_FINDINGS.md and the -px109760 arm.
    min_pixels: 100352
    max_pixels: 100352

training:
  batch_size: 1
  learning_rate: 2.0e-5
  # One epoch, as every ReCogDrive arm is, so the two students' runs are read the same way.
  epochs: 1
  num_workers: 4
  weight_decay: 0.01
  # The stock config warms up over 500 steps, which on 36.5k rows at an effective batch of 24 is a
  # third of the whole run. 100 is ~7%, which is the usual shape for a fine-tune off a trained
  # checkpoint rather than a cold start.
  lr_warmup_step: 100
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  accumulate_grad_batches: 4
  # Upstream multiplies a reasoning row's loss by 40 so scarce CoT data is not drowned out. Here 75%
  # of rows carry reasoning (medium/hard/extreme) and 25% do not (easy), so that factor would do the
  # opposite of its purpose: with gradient_clip_val=1.0 clipping by value, every CoT step saturates
  # the clip and the easy rows -- the whole point of gating reasoning on difficulty -- barely train.
  # 1.0 treats both kinds equally. Set it back to 40 to reproduce upstream's weighting.
  cot_loss_scale: 1.0

data:
  train:
    json_dataset_path:
      - /mnt/efs/users/rod/student_runs/sft_data/autovla_hugsim_final-rewind_executed5s_train
    sensor_data_path:
      - null
  val:
    # Held out BY SCENARIO (split_train_val.py); a row split would share frames across the halves.
    json_dataset_path: /mnt/efs/users/rod/student_runs/sft_data/autovla_hugsim_final-rewind_executed5s_val
    sensor_data_path: null

inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
