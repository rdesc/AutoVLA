name: qwen2.5-vl-3B-hugsim-pdmclosed-sft
description: >
  AutoVLA_PDMS_89 fine-tuned on HUGSIM's PDM-Closed planner, seed 0 (oracle_pdm_closed_hd). 7,158 train rows over 178 dev
  scenarios, executed 5 s targets, direct-decision answers -- a planner emits a trajectory, not language,
  so there is no reasoning to carry. NOTE the demonstrator is weak: PDM-Closed COMPLETED only 129 of its
  265 runs (74 vehicle collisions, 52 stalls, 8 background), where the Claude teacher was rewound until
  it succeeded. The builder drops steps whose own plan HUGSIM scored nc==0 or dac==0 and steps whose 5 s
  future reaches a failed end, but a demonstrator that fails half its runs is still the ceiling here.

  RECIPE is the Claude-teacher arm's (All* 38.6) exactly -- effective batch 24, lr 2e-5 held flat,
  1 epoch, init from the released checkpoint -- so the only thing that differs between those arms and
  this one is WHO produced the demonstrations. Because this arm carries no reasoning, the honest
  comparison is `autovla_ft_noreason` (All* 32.0), not the 38.6 reasoning arm.

  Built by student-driver simulators/hugsim_garage/agents/autovla_client/make_oracle_sft_data.py.

model:
  use_cot: true
  pretrained_model_path: /opt/dlami/nvme/rod/ckpts/autovla/Qwen2.5-VL-3B-Instruct
  # Continue from the released checkpoint rather than base Qwen: this is a fine-tune of AutoVLA,
  # not a retrain. run_sft.py fails loudly if the tensors do not match.
  init_from_checkpoint: /mnt/efs/users/rod/ckpts/AutoVLA/AutoVLA_PDMS_89.ckpt
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

training:
  batch_size: 1
  learning_rate: 2.0e-5
  # One epoch, as every ReCogDrive arm is, so the two students' runs are read the same way.
  epochs: 1
  num_workers: 4
  weight_decay: 0.01
  # The stock config warms up over 500 steps, which on 36.5k rows at an effective batch of 24 is a
  # third of the whole run. 100 is ~7%, which is the usual shape for a fine-tune off a trained
  # checkpoint rather than a cold start.
  # 7% of this run, matching the teacher arm's 100-of-1435. Keeping 100 absolute would be 34% of a
  # 298-step run, which is a different schedule, not the same recipe.
  lr_warmup_step: 21
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  # 8 GPUs x 1 x 3 = 24, the teacher arm's effective batch (it ran 6 x 1 x 4).
  # 7158 rows / 24 = 298 optimizer steps. lr_step_frequency 2000 never fires at that length,
  # so the LR is flat after warmup -- as it was for the 38.6 arm.
  accumulate_grad_batches: 3
  val_check_interval: 0.25
  save_top_k: -1
  checkpoint_every_n_epochs: null
  # Upstream multiplies a reasoning row's loss by 40 so scarce CoT data is not drowned out. Here 75%
  # of rows carry reasoning (medium/hard/extreme) and 25% do not (easy), so that factor would do the
  # opposite of its purpose: with gradient_clip_val=1.0 clipping by value, every CoT step saturates
  # the clip and the easy rows -- the whole point of gating reasoning on difficulty -- barely train.
  # 1.0 treats both kinds equally. Set it back to 40 to reproduce upstream's weighting.
  cot_loss_scale: 1.0

data:
  train:
    json_dataset_path:
      - /mnt/efs/users/rod/student_runs/sft_data/autovla_hugsim_pdmclosed_executed5s_train
    sensor_data_path:
      - null
  val:
    # Held out BY SCENARIO (split_train_val.py); a row split would share frames across the halves.
    json_dataset_path: /mnt/efs/users/rod/student_runs/sft_data/autovla_hugsim_pdmclosed_executed5s_val
    sensor_data_path: null

inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
