name: qwen2.5-vl-3B-hugsim-teacher-px109760
description: >
  The Claude-teacher arm again, changing ONE thing: the video resolution the prompt is built at,
  from 100352 to the 109760 the eval driver actually uses.

  dataset_utils/sft_dataset.py hardcoded min_pixels = max_pixels = 28*28*128 = 100352 in all three
  prompt branches and ignored model.video.*, while alpasim_autovla/inference.py builds its prompt at
  109760. So every arm to date trained on ~317x317 video and was evaluated on ~331x331 -- a genuine
  train/test mismatch, roughly 9% in pixel count. It affects HUGSIM and Alpasim equally, so it is not
  what differentiates them, but it is free to test.

  Everything else is the published arm's recipe -- effective batch 24, lr 2e-5 held flat, 1 epoch,
  init from AutoVLA_PDMS_89 -- so this is read against autovla_ft (All* 38.6) and conv3ep1 (41.0),
  the same recipe at 100352. Mind the +-2.4 point noise floor between those two: this arm has to beat
  41.0 by more than that to mean anything.

model:
  use_cot: true
  pretrained_model_path: /opt/dlami/nvme/rod/ckpts/autovla/Qwen2.5-VL-3B-Instruct
  # Continue from the released checkpoint rather than base Qwen: this is a fine-tune of AutoVLA,
  # not a retrain. run_sft.py fails loudly if the tensors do not match.
  init_from_checkpoint: /mnt/efs/users/rod/ckpts/AutoVLA/AutoVLA_PDMS_89.ckpt
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  trajectory:
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens:
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    # THE VARIABLE UNDER TEST: match the eval driver's 109760 instead of the 100352 every other
    # arm trained at.
    min_pixels: 109760
    max_pixels: 109760

training:
  batch_size: 1
  learning_rate: 2.0e-5
  # One epoch, as every ReCogDrive arm is, so the two students' runs are read the same way.
  epochs: 1
  num_workers: 4
  weight_decay: 0.01
  # The stock config warms up over 500 steps, which on 36.5k rows at an effective batch of 24 is a
  # third of the whole run. 100 is ~7%, which is the usual shape for a fine-tune off a trained
  # checkpoint rather than a cold start.
  lr_warmup_step: 100
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null
  # 8 GPUs x 1 x 3 = 24, the published arm's effective batch (it ran 6 x 1 x 4).
  accumulate_grad_batches: 3
  val_check_interval: 0.25
  save_top_k: -1
  checkpoint_every_n_epochs: null
  # Upstream multiplies a reasoning row's loss by 40 so scarce CoT data is not drowned out. Here 75%
  # of rows carry reasoning (medium/hard/extreme) and 25% do not (easy), so that factor would do the
  # opposite of its purpose: with gradient_clip_val=1.0 clipping by value, every CoT step saturates
  # the clip and the easy rows -- the whole point of gating reasoning on difficulty -- barely train.
  # 1.0 treats both kinds equally. Set it back to 40 to reproduce upstream's weighting.
  cot_loss_scale: 1.0

data:
  train:
    json_dataset_path:
      - /mnt/efs/users/rod/student_runs/sft_data/autovla_hugsim_final-rewind_executed5s_train
    sensor_data_path:
      - null
  val:
    # Held out BY SCENARIO (split_train_val.py); a row split would share frames across the halves.
    json_dataset_path: /mnt/efs/users/rod/student_runs/sft_data/autovla_hugsim_final-rewind_executed5s_val
    sensor_data_path: null

inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0
