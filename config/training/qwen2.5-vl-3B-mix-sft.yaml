
name: qwen2.5-vl-3B-mix-sft
description: AutoVLA based on Qwen 2.5 VL 3B model fine-tuned on mixed nuPlan + nuScenes dataset with CoT

# model
model:
  use_cot: true
  pretrained_model_path: ./Qwen2.5-VL-3B-Instruct
  train_vision_backbone: false
  train_lm_backbone: true
  codebook_cache_path: "codebook_cache/agent_vocab.pkl"
  trajectory: # future trajectory parameters
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens: # action token parameters, depends on the pretrained large model
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    # 100352 == 28*28*128, which is what dataset_utils/sft_dataset.py actually used while these
    # arms trained: it hardcoded the value and ignored this key. Pinned explicitly now that the
    # code reads it, so every published arm stays reproducible. The EVAL driver uses 109760, so
    # this is a real train/test mismatch -- see docs/FINETUNING_FINDINGS.md and the -px109760 arm.
    min_pixels: 100352
    max_pixels: 100352

# training
training:
  batch_size: 1
  learning_rate: 2.0e-5
  epochs: 5
  num_workers: 4
  weight_decay: 0.01
  lr_warmup_step: 500
  lr_step_frequency: 2000
  lr_step_gamma: 0.98
  train_sample_size: null  # Number of examples to randomly sample from training set, set to null to use full dataset
  accumulate_grad_batches: 4

data:
  train:
      json_dataset_path: 
        - ./dataset/nuplan/trainval
        - ./dataset/nuscenes/nuscenes_train
      sensor_data_path: 
        - ./dataset/nuplan/sensor_blobs/trainval
        - null

  val:
      scene_filter: ./navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtest.yaml
      metric_cache_path: ./dataset/nuplan/navtest_metric_cache
      json_dataset_path: ./dataset/nuplan/navtest
      sensor_data_path: ./dataset/nuplan/sensor_blobs/test


inference:
  batch_size: 1
  num_workers: 2
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0
    top_p: 1.0